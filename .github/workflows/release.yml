name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check that the tag matches pluginVersion
        run: |
          version="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pluginVersion $version in gradle.properties"
            exit 1
          fi

      - name: Test and sign
        run: ./gradlew test signPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      # Attached before publishing so the very first release, which the Marketplace only accepts as a manual upload,
      # still produces the signed zip to upload.
      - name: Attach signed plugin to the GitHub release
        run: gh release upload "$GITHUB_REF_NAME" build/distributions/*-signed.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
